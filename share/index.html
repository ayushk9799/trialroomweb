<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Open TrialRoom to continue your shared outfit try-on." />
  <title>Open TrialRoom</title>
  <style>
    :root {
      --primary: #ff2d55;
      --primary-soft: #fff0f4;
      --ink: #18181b;
      --muted: #62626b;
      --line: #f3d3dd;
      --white: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(180deg, #fffafb 0%, var(--primary-soft) 55%, #ffffff 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page {
      width: min(100% - 32px, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 34px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 28px;
    }

    .nav,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .logo {
      width: 146px;
      height: auto;
    }

    .nav-link,
    .footer a {
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 750;
    }

    .content {
      align-self: center;
      text-align: center;
    }

    .mascot-wrap {
      width: min(74vw, 280px);
      margin: 0 auto 22px;
      border-radius: 999px 999px 42px 42px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 80px rgba(255, 45, 85, 0.14);
      overflow: hidden;
    }

    .mascot {
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.45rem, 11vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subcopy {
      max-width: 500px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 560;
    }

    .actions {
      display: grid;
      gap: 12px;
      width: min(100%, 330px);
      margin: 30px auto 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 820;
    }

    .button.primary {
      color: var(--white);
      background: var(--primary);
      box-shadow: 0 16px 36px rgba(255, 45, 85, 0.22);
    }

    .button.secondary {
      color: var(--primary);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .hint {
      margin: 16px auto 0;
      color: #85858d;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .footer {
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 24px, 760px);
      }

      .nav,
      .footer {
        flex-direction: column;
        justify-content: flex-start;
        text-align: center;
      }

      .logo {
        width: 122px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="TrialRoom">
      <a href="../">
        <img class="logo" src="../assets/trialroom-logo.png" alt="TrialRoom" />
      </a>
      <a class="nav-link" href="../">Home</a>
    </nav>

    <section class="content">
      <div class="mascot-wrap" aria-hidden="true">
        <img class="mascot" src="../assets/loginmascot.png" alt="" />
      </div>
      <h1>Open TrialRoom</h1>
      <p class="subcopy">
        Your outfit was saved from the share sheet. Open the app to preview it and continue your try-on.
      </p>

      <div class="actions">
        <a class="button primary" id="openAppLink" href="trialroom://share">Open TrialRoom</a>
        <a class="button secondary" id="storeLink" href="https://apps.apple.com/search?term=TrialRoom">Get the app</a>
      </div>
      <p class="hint">If the app does not open, install TrialRoom or open it from your Home Screen.</p>
    </section>

    <footer class="footer">
      <span>&copy; 2026 TrialRoom</span>
      <a href="../privacy.html">Privacy Policy</a>
    </footer>
  </main>

  <script>
    const STORE_LINKS = {
      ios: 'https://apps.apple.com/search?term=TrialRoom',
      android: 'https://play.google.com/store/apps/details?id=com.thousandways.trialroom',
    };

    const ua = navigator.userAgent || navigator.vendor || '';
    const isAndroid = /android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const storeLink = document.getElementById('storeLink');

    if (isAndroid) {
      storeLink.href = STORE_LINKS.android;
    } else if (isIOS) {
      storeLink.href = STORE_LINKS.ios;
    }

    document.getElementById('openAppLink').addEventListener('click', () => {
      setTimeout(() => {
        if (isAndroid) {
          window.location.href = STORE_LINKS.android;
        }
      }, 900);
    });
  </script>
</body>
</html>
